name: SuperKart MLOps Pipeline

on:
  push:
    branches:
      - main              # automatically triggers on every push to the main branch
  workflow_dispatch:      # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write         # needed so the pipeline can commit the trained model back to main

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: superkart_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Register Dataset
        run: python superkart_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: superkart_project/data/SuperKart.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: superkart_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Run Data Preparation
        run: python superkart_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: superkart_project/requirements.txt
      - name: Install Dependencies
        run: pip install -r superkart_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 > mlflow_server.log 2>&1 &  # run in the background
          sleep 10  # give the server a moment to start
      - name: Model Building
        run: python superkart_project/model_building/train.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add superkart_project/deployment/superkart_model.joblib superkart_project/deployment/model_metrics.json
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

  app-smoke-test:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # pick up the model committed by the previous job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install App Dependencies
        run: pip install -r superkart_project/deployment/requirements.txt
      - name: Smoke Test Streamlit App
        run: python superkart_project/model_building/smoke_test.py
